name: Build Horizon Switch NRO

on:
  workflow_dispatch:

jobs:
  build-nro:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout horizon-nx
        uses: actions/checkout@v4
        with:
          path: horizon-nx

      - name: Checkout bevy-horizon
        uses: actions/checkout@v4
        with:
          repository: JohnUzoka/bevy-horizon
          path: bevy-horizon

      - name: Checkout horizon-mods
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mods
          path: horizon-mods

      - name: Apply Veinminer, Coords HUD, Zoomify & Jade
        run: |
          mkdir -p horizon-nx/mods
          for mod in veinminer coords_hud zoomify zoom jade; do
            find horizon-mods -type f -iname "*${mod}*.hnmod" -exec cp -v {} horizon-nx/mods/ \;
          done
          ls -la horizon-nx/mods
          if ls horizon-nx/mods/*.hnmod 1> /dev/null 2>&1; then
            python3 horizon-mods/native/tools/native.py apply horizon-nx horizon-nx/mods/*.hnmod || true
          fi

      - name: Build toolchain image
        run: |
          cd bevy-horizon
          docker build -t bevy-horizon-toolchain:local -f Containerfile .

      - name: Apply Switch patches
        run: |
          mkdir -p bevy-horizon/patches/getrandom-0.2/src bevy-horizon/patches/getrandom-0.3/src
          printf '[package]\nname = "getrandom"\nversion = "0.2.15"\nedition = "2021"\n[features]\ndefault = []\nstd = []\njs = []\n' > bevy-horizon/patches/getrandom-0.2/Cargo.toml
          cat << 'EOF' > bevy-horizon/patches/getrandom-0.2/src/lib.rs
          #![no_std]
          use core::num::NonZeroU32;
          #[derive(Copy, Clone, Debug, Eq, PartialEq)]
          pub struct Error(NonZeroU32);
          impl Error {
              pub const UNSUPPORTED: Error = Error(unsafe { NonZeroU32::new_unchecked(1) });
              pub fn code(self) -> NonZeroU32 { self.0 }
              pub fn raw_os_error(self) -> Option<i32> { Some(self.0.get() as i32) }
          }
          impl core::fmt::Display for Error {
              fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result { write!(f, "getrandom error") }
          }
          impl From<NonZeroU32> for Error {
              fn from(code: NonZeroU32) -> Self { Error(code) }
          }
          extern "C" { fn randomGet(buf: *mut core::ffi::c_void, len: usize); }
          pub fn getrandom(dest: &mut [u8]) -> Result<(), Error> {
              unsafe { randomGet(dest.as_mut_ptr() as *mut core::ffi::c_void, dest.len()); }
              Ok(())
          }
          EOF

          printf '[package]\nname = "getrandom"\nversion = "0.3.4"\nedition = "2021"\n' > bevy-horizon/patches/getrandom-0.3/Cargo.toml
          cat << 'EOF' > bevy-horizon/patches/getrandom-0.3/src/lib.rs
          #![no_std]
          use core::num::NonZeroU32;
          #[derive(Copy, Clone, Debug, Eq, PartialEq)]
          pub struct Error(NonZeroU32);
          impl Error {
              pub const UNSUPPORTED: Error = Error(unsafe { NonZeroU32::new_unchecked(1) });
              pub fn code(self) -> NonZeroU32 { self.0 }
              pub fn raw_os_error(self) -> Option<i32> { Some(self.0.get() as i32) }
          }
          impl core::fmt::Display for Error {
              fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result { write!(f, "getrandom error") }
          }
          impl From<NonZeroU32> for Error {
              fn from(code: NonZeroU32) -> Self { Error(code) }
          }
          extern "C" { fn randomGet(buf: *mut core::ffi::c_void, len: usize); }
          pub fn fill(dest: &mut [u8]) -> Result<(), Error> {
              unsafe { randomGet(dest.as_mut_ptr() as *mut core::ffi::c_void, dest.len()); }
              Ok(())
          }
          pub fn u32() -> Result<u32, Error> { let mut b = [0u8; 4]; fill(&mut b)?; Ok(u32::from_ne_bytes(b)) }
          pub fn u64() -> Result<u64, Error> { let mut b = [0u8; 8]; fill(&mut b)?; Ok(u64::from_ne_bytes(b)) }
          EOF

          for crate in wayland-backend wayland-client wayland-protocols wayland-csd-frame wayland-cursor calloop-wayland-source wayland-protocols-wlr wayland-protocols-plasma smithay-client-toolkit sctk-adwaita x11rb calloop; do
            mkdir -p "bevy-horizon/patches/$crate/src"
            touch "bevy-horizon/patches/$crate/src/lib.rs"
          done

          printf '[package]\nname = "wayland-backend"\nversion = "0.3.17"\nedition = "2021"\n[features]\nclient_system = []\ndlopen = []\n' > bevy-horizon/patches/wayland-backend/Cargo.toml
          printf '[package]\nname = "wayland-client"\nversion = "0.31.15"\nedition = "2021"\n' > bevy-horizon/patches/wayland-client/Cargo.toml
          printf '[package]\nname = "wayland-protocols"\nversion = "0.32.13"\nedition = "2021"\n[features]\nclient = []\nserver = []\nstaging = []\nunstable = []\n' > bevy-horizon/patches/wayland-protocols/Cargo.toml
          printf '[package]\nname = "wayland-csd-frame"\nversion = "0.3.0"\nedition = "2021"\n[features]\ndefault = []\n' > bevy-horizon/patches/wayland-csd-frame/Cargo.toml
          printf '[package]\nname = "wayland-cursor"\nversion = "0.31.11"\nedition = "2021"\n[features]\ndefault = []\n' > bevy-horizon/patches/wayland-cursor/Cargo.toml
          printf '[package]\nname = "calloop-wayland-source"\nversion = "0.3.0"\nedition = "2021"\n[features]\ndefault = []\n' > bevy-horizon/patches/calloop-wayland-source/Cargo.toml
          printf '[package]\nname = "wayland-protocols-wlr"\nversion = "0.3.12"\nedition = "2021"\n[features]\ndefault = []\nclient = []\nserver = []\n' > bevy-horizon/patches/wayland-protocols-wlr/Cargo.toml
          printf '[package]\nname = "wayland-protocols-plasma"\nversion = "0.3.12"\nedition = "2021"\n[features]\ndefault = []\nclient = []\nserver = []\n' > bevy-horizon/patches/wayland-protocols-plasma/Cargo.toml
          printf '[package]\nname = "smithay-client-toolkit"\nversion = "0.19.2"\nedition = "2021"\n[features]\ndefault = []\ncalloop = []\nxkbcommon = []\n' > bevy-horizon/patches/smithay-client-toolkit/Cargo.toml
          printf '[package]\nname = "sctk-adwaita"\nversion = "0.10.1"\nedition = "2021"\n[features]\ndefault = []\nab_glyph = []\ncrossfont = []\n' > bevy-horizon/patches/sctk-adwaita/Cargo.toml
          printf '[package]\nname = "x11rb"\nversion = "0.13.2"\nedition = "2021"\n[features]\ndefault = []\nallow-unsafe-code = []\ncursor = []\nrandr = []\nrender = []\nresource_manager = []\nshape = []\nsync = []\nxfixes = []\nxi = []\nxinput = []\nxkb = []\ndl-libxcb = []\n' > bevy-horizon/patches/x11rb/Cargo.toml
          printf '[package]\nname = "calloop"\nversion = "0.13.0"\nedition = "2021"\n[features]\ndefault = []\nexecutor = []\nsignals = []\nblock_on = []\n' > bevy-horizon/patches/calloop/Cargo.toml

          mkdir -p bevy-horizon/patches/rustix-038/src bevy-horizon/patches/winit-stub/src bevy-horizon/patches/arboard/src
          touch bevy-horizon/patches/rustix-038/src/lib.rs bevy-horizon/patches/winit-stub/src/lib.rs
          printf '[package]\nname = "rustix"\nversion = "0.38.44"\nedition = "2021"\n[features]\ndefault = []\nstd = []\nuse-libc-auxv = []\nfs = []\nnet = []\nio_uring = []\nparam = []\nprocess = []\nrand = []\nruntime = []\nshm = []\nsystem = []\ntermios = []\nthread = []\ntime = []\nevent = []\nmm = []\nmount = []\npipe = []\npty = []\nstdio = []\n' > bevy-horizon/patches/rustix-038/Cargo.toml
          printf '[package]\nname = "winit"\nversion = "0.30.13"\nedition = "2021"\n[features]\ndefault = []\nx11 = []\nwayland = []\nwayland-dlopen = []\nwayland-csd-adwaita = []\n' > bevy-horizon/patches/winit-stub/Cargo.toml
          printf '[package]\nname = "arboard"\nversion = "3.7.0"\nedition = "2021"\n[features]\ndefault = []\nwayland-data-control = []\nimage-data = []\n' > bevy-horizon/patches/arboard/Cargo.toml
          printf '#[derive(Debug,Clone)]pub enum Error{ContentNotAvailable,Unknown{description:String}}impl std::fmt::Display for Error{fn fmt(&self,f:&mut std::fmt::Formatter)->std::fmt::Result{write!(f,"err")}}impl std::error::Error for Error{}pub struct Clipboard;impl Clipboard{pub fn new()->Result<Self,Error>{Err(Error::ContentNotAvailable)}pub fn get_text(&mut self)->Result<String,Error>{Err(Error::ContentNotAvailable)}pub fn set_text<T:Into<String>>(&mut self,_:T)->Result<(),Error>{Err(Error::ContentNotAvailable)}}\n' > bevy-horizon/patches/arboard/src/lib.rs

          sed -i '0,/^getrandom =/s/^getrandom =/getrandom_04 =/' bevy-horizon/.cargo/bevy-0.18.toml
          sed -i 's|getrandom_04 = { path =|getrandom_04 = { package = "getrandom", path =|' bevy-horizon/.cargo/bevy-0.18.toml
          grep -E "^(rustix|polling|ring) =" bevy-horizon/Cargo.toml >> bevy-horizon/.cargo/bevy-0.18.toml
          sed -i 's/sa_family: 0_u16/sa_len: 16, sa_family: 0_u8/g; s/sa_data: \[0; 26\]/sa_data: [0; 14]/g; s/c::sockaddr_in {/c::sockaddr_in { sin_len: 16,/g' bevy-horizon/patches/rustix/src/backend/libc/net/read_sockaddr.rs bevy-horizon/patches/rustix/src/backend/libc/net/write_sockaddr.rs
          sed -i 's/-> c::sockaddr_in { sin_len: 16,/-> c::sockaddr_in {/' bevy-horizon/patches/rustix/src/backend/libc/net/write_sockaddr.rs

          cat << 'EOF' >> bevy-horizon/.cargo/bevy-0.18.toml
          getrandom = { path = "/src/bevy-horizon/patches/getrandom-0.2" }
          getrandom_03 = { package = "getrandom", path = "/src/bevy-horizon/patches/getrandom-0.3" }
          rustix_038 = { package = "rustix", path = "/src/bevy-horizon/patches/rustix-038" }
          winit = { path = "/src/bevy-horizon/patches/winit-stub" }
          arboard = { path = "/src/bevy-horizon/patches/arboard" }
