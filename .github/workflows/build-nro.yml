name: Build Horizon Switch NRO

on:
  workflow_dispatch:

jobs:
  build-nro:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          path: horizon-nx

      - uses: actions/checkout@v4
        with:
          repository: JohnUzoka/bevy-horizon
          path: bevy-horizon

      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mods
          path: horizon-mods

      - name: Apply Mods
        run: |
          mkdir -p horizon-nx/mods
          for mod in veinminer coords_hud zoomify zoom jade atlas freecam appleskin fullbright gamma inventory sort dynamic 3d; do
            find horizon-mods -type f -iname "*${mod}*.hnmod" -exec cp -v {} horizon-nx/mods/ \;
          done
          if ls horizon-nx/mods/*.hnmod 1> /dev/null 2>&1; then
            python3 horizon-mods/native/tools/native.py apply horizon-nx horizon-nx/mods/*.hnmod || true
          fi

      - name: Build toolchain image
        run: |
          cd bevy-horizon
          sed -i '/dkp-pacman/,/Scc/d' Containerfile
          printf '\nRUN mkdir -p /opt/devkitpro/devkitA64/aarch64-none-elf/include/sys && printf "#pragma once\\n#include <stddef.h>\\n#include <stdlib.h>\\n#define PROT_NONE 0\\n#define PROT_READ 1\\n#define PROT_WRITE 2\\n#define PROT_EXEC 4\\n#define MAP_PRIVATE 2\\n#define MAP_ANONYMOUS 0x20\\n#define MAP_ANON MAP_ANONYMOUS\\n#define MAP_NORESERVE 0\\n#define MAP_FAILED ((void*)-1)\\nstatic inline void* mmap(void* a,size_t l,int p,int f,int fd,long o){(void)a;(void)p;(void)f;(void)fd;(void)o;void* r=aligned_alloc(4096,(l+4095)&~4095ULL);return r?r:MAP_FAILED;}\\nstatic inline int munmap(void* a,size_t l){(void)l;free(a);return 0;}\\nstatic inline int mprotect(void* a,size_t l,int p){(void)a;(void)l;(void)p;return 0;}\\nstatic inline int madvise(void* a,size_t l,int ad){(void)a;(void)l;(void)ad;return 0;}\\n#define MADV_DONTNEED 4\\n#define MADV_FREE 8\\n" > /opt/devkitpro/devkitA64/aarch64-none-elf/include/sys/mman.h\n' >> Containerfile
          docker build -t bevy-horizon-toolchain:local -f Containerfile .

      - name: Build Horizon NRO directly
        run: |
          rm -rf bevy-horizon/.cargo horizon-nx/.cargo
          docker run --rm -v "$PWD:/src" -w /src/horizon-nx bevy-horizon-toolchain:local bash -c '
            set -e
            rm -rf /root/.cargo/config* "$CARGO_HOME/config*"
            export DEVKITPRO=/opt/devkitpro
            export DEVKITA64=/opt/devkitpro/devkitA64
            export PATH="$DEVKITA64/bin:/opt/devkitpro/tools/bin:/root/.cargo/bin:$PATH"
            rustup component add rust-src || true
            cargo +nightly build -Zbuild-std=std,panic_abort --release --target aarch64-nintendo-switch-freestanding --no-default-features -j 4
            ELF=$(find target/aarch64-nintendo-switch-freestanding/release -maxdepth 1 -type f -executable | head -n 1)
            elf2nro "$ELF" horizon-client.nro
          '
          ls -lh horizon-nx/horizon-client.nro

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-switch-nro-with-mods
          path: horizon-nx/horizon-client.nro
